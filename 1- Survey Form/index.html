<!DOCTYPE html>
<html>
<head>
  <title>Student Registration Survey</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

  <div class="main-container">
    <form class="form-box">
      <h2>Student Registration Survey</h2>

      <label>Name:</label><br>
      <input type="text" placeholder="Enter your name"><br><br>

      <label>Email:</label><br>
      <input type="email" placeholder="Enter your email"><br><br>

      <label>Age:</label><br>
      <input type="number" placeholder="Enter your age"><br><br>

      <label>Gender:</label><br>
      <input type="radio" name="gender"> Male
      <input type="radio" name="gender"> Female
      <input type="radio" name="gender"> Other<br><br>

      <label>Branch:</label><br>
      <select>
        <option>Computer Science</option>
        <option>Electronics</option>
        <option>Mechanical</option>
        <option>Civil</option>
        <option>Other</option>
      </select><br><br>

      <label>Skills:</label><br>
      <input type="checkbox"> HTML<br>
      <input type="checkbox"> CSS<br>
      <input type="checkbox"> JavaScript<br>
      <input type="checkbox"> Python<br><br>

      <label>Available for Internship:</label><br>
      <input type="radio" name="intern"> Yes
      <input type="radio" name="intern"> No<br><br>

      <button type="submit">Submit</button>
    </form>
  </div>

</body>
</html>
